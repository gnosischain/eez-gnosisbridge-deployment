# Root project: mocks, deploy scripts and fork tests (solc 0.8.25).
# The legacy bridge trees (solc 0.4.24 / 0.7.5) are compiled separately under build/ by scripts/build.sh
# and loaded here as artifacts with vm.getCode.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib/forge-std"]
remappings = ["forge-std/=lib/forge-std/src/"]

solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"

fs_permissions = [
  { access = "read", path = "./build" },
    { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
chiado = "${CHIADO_RPC_URL}"
rollupx_testnet = "${ROLLUPX_TESTNET_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
rollupx = "${ROLLUPX_RPC_URL}"

[fmt]
line_length = 120
